items:
  - question: З якого віку можна починати?
    answer: Дітей приймаємо з 6 років. Для дорослих верхньої межі немає — займатися можна в будь-якому віці, навантаження підбирається індивідуально.
  - question: Чи потрібна спортивна підготовка?
    answer: "Ні. Новачки починають з основ: стійка, пересування, базові удари та загальна фізична підготовка. Форма прийде з тренуваннями."
  - question: Що взяти на перше тренування?
    answer: Зручний спортивний одяг (футболку та шорти чи спортивні штани), воду й рушник. Купувати екіпіровку одразу не потрібно — тренер підкаже, що і коли знадобиться.
  - question: Яка екіпіровка знадобиться згодом?
    answer: "Базовий набір для кікбоксингу WAKO: рукавиці, бинти, капа, шолом, захист гомілки та стопи, бандаж (для дівчат — захист грудей). Точний список залежить від дисципліни — тренер допоможе з вибором."
  - question: Чи підходить кікбоксинг дівчатам?
    answer: Так! Кікбоксинг однаково підходить дівчатам і хлопцям — розвиває силу, гнучкість і впевненість у собі. На змаганнях WAKO дівчата виступають в окремих категоріях.
  - question: Чи безпечно це для дитини?
    answer: Тренування проходять під наглядом тренера, з поступовим збільшенням навантаження. Спаринги — лише після освоєння техніки та в захисній екіпіровці.
  - question: Як часто потрібно тренуватися?
    answer: Оптимально — 2–3 рази на тиждень. Спортсмени, які готуються до змагань, тренуються частіше.
  - question: Чи обов’язково брати участь у змаганнях?
    answer: Ні, змагання — за бажанням. Хтось тренується для здоров’я та форми, а хтось готується до турнірів WAKO у спортивній групі.
  - question: Скільки коштують тренування?
    answer: Вартість залежить від групи та формату занять (групові чи індивідуальні). Актуальні ціни — у Telegram або за телефоном.
  - question: Як записатися?
    answer: Залиште заявку у [формі на сайті](#contacts) або напишіть у Telegram — підберемо групу, зал і зручний час.
