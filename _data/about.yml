photo: ''
lead: Тренер з кікбоксингу WAKO, м. Львів.
text: 'Тренування для дітей, підлітків і дорослих — від перших кроків у залі до виступів
  на змаганнях.


  В основі — правильна техніка, фізична підготовка та дисципліна. Кожен прогресує
  у своєму темпі: хтось приходить за формою та впевненістю, хтось — за медалями.'
