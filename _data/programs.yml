items:
  - icon: baby
    tag: 6–11 років
    title: Діти
    text: Координація, дисципліна та впевненість у собі. Заняття в ігровій формі з поступовим вивченням техніки.
  - icon: users
    tag: 12–17 років
    title: Підлітки
    text: Постановка техніки, загальна та спеціальна фізична підготовка, перші змагання.
  - icon: dumbbell
    tag: 18+
    title: Дорослі
    text: Кікбоксинг для форми, витривалості та самозахисту. Підходить для будь-якого рівня підготовки.
  - icon: trophy
    tag: За відбором
    title: Спортивна група
    text: "Підготовка до змагань WAKO: чемпіонати області, України та міжнародні турніри."
  - icon: user
    tag: Персонально
    title: Індивідуальні
    text: Персональна програма, робота над технікою й тактикою у зручний для вас час.
